# fly.toml — adjust `app` and `primary_region` before first deploy.
# Run `fly launch --no-deploy` once to claim the app name, then `fly deploy`.

app = "federal-infographic-toolkit"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[mounts]]
  source = "data"
  destination = "/data"
  initial_size = "5gb"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DB_PATH = "/data/app.db"
  DATA_DIR = "/data"
  PUBLIC_DIR = "/app/public"
